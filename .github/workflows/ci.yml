name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Server tests (embedded Postgres) and client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix client ci
      - name: Server end-to-end tests
        run: npm --prefix server run smoke
      - name: Client unit tests
        run: npm --prefix client test
      - name: Client production build
        run: npm --prefix client run build

  postgres:
    name: Server tests on real PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMOKE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGSSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run smoke
