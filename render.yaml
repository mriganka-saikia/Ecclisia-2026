# One-service deploy: Express serves the API and the built React app.
services:
  - type: web
    name: timebank
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COLLEGE_EMAIL_DOMAIN
        value: college.edu          # <- your real college domain
      - key: DATABASE_URL
        sync: false                 # paste the Supabase connection string
      - key: LLM_API_KEY
        sync: false                 # optional: enables AI semantic search
      - key: CLIENT_ORIGIN
        value: https://timebank.onrender.com
      - key: DEMO_MODE
        value: "true"               # keep true for judging; set false afterwards
      - key: AUTO_SEED
        value: "true"
